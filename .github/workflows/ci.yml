name: CI

on:
  push:
  pull_request:
  # Run the benchmark report by hand: Actions -> CI -> Run workflow.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Install the toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

  deny:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  typos:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: crate-ci/typos@v1.51.1

  test:
    name: test (${{ matrix.os }}, tmux ${{ matrix.tmux }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
        tmux: ["3.2a", "latest"]
    steps:
      - uses: actions/checkout@v7
      - name: Resolve the tmux version
        id: tmux
        run: |
          if [ "${{ matrix.tmux }}" = "latest" ]; then
            version="$(tr -d '[:space:]' < .github/tmux-latest)"
          else
            version="${{ matrix.tmux }}"
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
      - name: Cache tmux
        uses: actions/cache@v6
        with:
          path: ~/.local/tmux-*
          key: tmux-${{ runner.os }}-${{ runner.arch }}-${{ steps.tmux.outputs.version }}-${{ hashFiles('.github/scripts/install-tmux.sh') }}
      - name: Install tmux ${{ steps.tmux.outputs.version }}
        run: bash .github/scripts/install-tmux.sh "${{ steps.tmux.outputs.version }}"
      - name: Install the toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --all-features --locked

  bench:
    # Informational: shared runners are far too busy for the gate's numbers to
    # mean anything. It proves the bench runs and reports, never that it passes.
    name: bench (informational, not a gate)
    runs-on: macos-14
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      # The bench starts a real tmux server; the macOS runner image has none.
      - name: Install tmux
        run: brew install tmux
      - name: Install the toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked -p duohive
      - name: A 10-agent run, reported but not judged
        env:
          DUOHIVE_BENCH_IGNORE_LOAD: "1"
        run: ./target/release/duohive bench --agents 10 --idle-secs 10 --view

  bench-gate:
    # The full gate (`duohive bench --gate`: three counted runs at 10 and at 100 agents, the
    # worst value per target deciding) on a hosted Apple-silicon runner, published as a report.
    # A shared VM is not the plugged-in M-series machine of TD section 10, so the load check is
    # off and a miss does not fail the workflow: this is the benchmark report, not the release
    # gate. It runs on pushes to main and by hand, not on every pull request.
    name: bench report (macOS arm64, full gate)
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: macos-14
    timeout-minutes: 150
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - name: Install tmux
        run: brew install tmux
      - name: Install the toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked -p duohive
      - name: The full gate
        env:
          DUOHIVE_BENCH_IGNORE_LOAD: "1"
        run: ./target/release/duohive bench --gate --json > bench-gate.json || echo "gate exit code $?"
      - name: Publish the report
        if: always()
        run: python3 .github/scripts/bench-report.py bench-gate.json >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bench-gate-report
          path: bench-gate.json
          if-no-files-found: warn
