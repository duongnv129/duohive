name: CI

on:
  push:
  pull_request:
  # Run the benchmark report by hand: Actions -> CI -> Run workflow.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Install the toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

  deny:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  typos:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: crate-ci/typos@v1.51.1

  test:
    name: test (${{ matrix.os }}, tmux ${{ matrix.tmux }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
        tmux: ["3.2a", "latest"]
    steps:
      - uses: actions/checkout@v7
      - name: Resolve the tmux version
        id: tmux
        run: |
          if [ "${{ matrix.tmux }}" = "latest" ]; then
            version="$(tr -d '[:space:]' < .github/tmux-latest)"
          else
            version="${{ matrix.tmux }}"
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
      - name: Cache tmux
        uses: actions/cache@v6
        with:
          path: ~/.local/tmux-*
          key: tmux-${{ runner.os }}-${{ runner.arch }}-${{ steps.tmux.outputs.version }}-${{ hashFiles('.github/scripts/install-tmux.sh') }}
      - name: Install tmux ${{ steps.tmux.outputs.version }}
        run: bash .github/scripts/install-tmux.sh "${{ steps.tmux.outputs.version }}"
      - name: Install the toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --all-features --locked

  docs:
    # The README, the docs index and the changelog stay true: relative links resolve, the version
    # has a changelog entry, and the README lists every release target the workflow builds.
    name: docs
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - run: sh scripts/check-docs.sh

  workflows:
    name: workflows (actionlint)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: actionlint
        run: docker run --rm -v "$PWD:/repo" --workdir /repo rhysd/actionlint:1.7.7 -color

  package:
    # `cargo package` works while `publish = false`; `cargo publish --dry-run` does not. The core
    # is built from its own tarball; the others only list their files, because they depend on
    # crates that are not on crates.io yet.
    name: package (every crate packs)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Install the toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Every crate lists its package files
        run: |
          set -eu
          for crate in duohive-core duohive-cli duohive-store duohive-tmux duohive-tui duohive-mcp duohive; do
            cargo package --list --locked -p "$crate" --allow-dirty > /dev/null
          done
      - name: The core packs and builds from its own tarball
        run: cargo package --locked -p duohive-core --allow-dirty

  install:
    # The README's "From source" path on clean runners: build, install to a private prefix, run the
    # commands, uninstall. tmux comes from the package manager; the installer only checks it here.
    name: install from source (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Install tmux
        run: |
          if [ "$RUNNER_OS" = macOS ]; then brew install tmux; else sudo apt-get update && sudo apt-get install -y tmux; fi
          tmux -V
      - name: Install the toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - name: ./install.sh to a private prefix
        run: sh ./install.sh --no-deps --prefix "$RUNNER_TEMP/dh"
      - name: The installed commands run and agree
        run: |
          set -eu
          bin="$RUNNER_TEMP/dh/bin"
          "$bin/duohive" --version
          "$bin/dh" --version
          [ "$("$bin/dh" --version)" = "$("$bin/duohive" --version)" ]
          "$bin/duohive" --help > /dev/null
      - name: Uninstall removes only what it installed
        run: |
          set -eu
          sh ./install.sh --no-deps --uninstall --prefix "$RUNNER_TEMP/dh"
          [ ! -e "$RUNNER_TEMP/dh/bin/duohive" ]
          [ ! -e "$RUNNER_TEMP/dh/bin/dh" ]

  bench:
    # Informational: shared runners are far too busy for the gate's numbers to
    # mean anything. It proves the bench runs and reports, never that it passes.
    name: bench (informational, not a gate)
    runs-on: macos-14
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      # The bench starts a real tmux server; the macOS runner image has none.
      - name: Install tmux
        run: brew install tmux
      - name: Install the toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked -p duohive
      - name: A 10-agent run, reported but not judged
        env:
          DUOHIVE_BENCH_IGNORE_LOAD: "1"
        run: ./target/release/duohive bench --agents 10 --idle-secs 10 --view

  bench-gate:
    # The full gate (`duohive bench --gate`: three counted runs at 10 and at 100 agents, the
    # worst value per target deciding) on a hosted Apple-silicon runner, published as a report.
    # A shared VM is not the plugged-in M-series machine of TD section 10, so the load check is
    # off and a miss does not fail the workflow: this is the benchmark report, not the release
    # gate. It runs on pushes to main and by hand, not on every pull request.
    name: bench report (macOS arm64, full gate)
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: macos-14
    timeout-minutes: 150
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - name: Install tmux
        run: brew install tmux
      - name: Install the toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked -p duohive
      - name: The full gate
        env:
          DUOHIVE_BENCH_IGNORE_LOAD: "1"
        # The result goes outside the checkout, so the gate sees a clean tree (git_dirty).
        run: ./target/release/duohive bench --gate --json > "$RUNNER_TEMP/bench-gate.json" || echo "gate exit code $?"
      - name: Publish the report
        if: always()
        run: python3 .github/scripts/bench-report.py "$RUNNER_TEMP/bench-gate.json" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: bench-gate-report
          path: ${{ runner.temp }}/bench-gate.json
          if-no-files-found: warn
