[files]
extend-exclude = ["target/", "*.lock", "crates/duohive-cli/tests/fixtures/", "spikes/s3/fixtures/", "crates/duohive-tui/tests/fixtures/"]

[default.extend-words]
ratatui = "ratatui"
Ratatui = "Ratatui"
# A branch name cut in the middle in a snapshot (duohive/pay…etry-cases).
etry = "etry"

[default]
# Short git hashes in backticks (`ba0bbd5`) are not words.
extend-ignore-re = ["`[0-9a-f]{7,40}`"]
