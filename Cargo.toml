[workspace]
members = ["crates/*"]
exclude = ["spikes"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
duohive-core = { path = "crates/duohive-core", version = "0.1.0" }
duohive-tmux = { path = "crates/duohive-tmux", version = "0.1.0" }
duohive-cli = { path = "crates/duohive-cli", version = "0.1.0" }
duohive-store = { path = "crates/duohive-store", version = "0.1.0" }
duohive-tui = { path = "crates/duohive-tui", version = "0.1.0" }
duohive-mcp = { path = "crates/duohive-mcp", version = "0.1.0" }

tokio = "1.53"
ratatui = "=0.30.2"
crossterm = "=0.29.0"
rusqlite = { version = "0.40", features = ["bundled"] }
toml = "1.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = "0.3"
tracing-appender = "0.2"
shell-words = "1.1"
getrandom = "0.4"
libc = "0.2"
insta = { version = "1.49", features = ["yaml"] }
tempfile = "3"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
