[workspace]
members = ["crates/*"]
exclude = ["spikes"]
resolver = "3"

[profile.release]
# The binary budget (PRD: under 10 MB): drop symbols, link once, compile as one unit.
strip = true
lto = "thin"
codegen-units = 1

[profile.dist]
# The cargo-dist build. No overrides: it must be the same size as the release
# build the gate measures (P5-D3).
inherits = "release"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "Apache-2.0"
publish = false
repository = "https://github.com/duongnv129/duohive"
readme = "README.md"
keywords = ["tmux", "ai", "agents", "tui", "claude"]
categories = ["command-line-utilities", "development-tools"]

[workspace.dependencies]
duohive-core = { path = "crates/duohive-core", version = "0.1.0" }
duohive-tmux = { path = "crates/duohive-tmux", version = "0.1.0" }
duohive-cli = { path = "crates/duohive-cli", version = "0.1.0" }
duohive-store = { path = "crates/duohive-store", version = "0.1.0" }
duohive-tui = { path = "crates/duohive-tui", version = "0.1.0" }
duohive-mcp = { path = "crates/duohive-mcp", version = "0.1.0" }

tokio = "1.53"
ratatui = { version = "=0.30.2", default-features = false, features = ["crossterm", "layout-cache", "underline-color"] }
unicode-segmentation = "1.13"
vt100 = "=0.16.2"
crossterm = "=0.29.0"
rusqlite = { version = "0.40", features = ["bundled"] }
toml = "1.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = { version = "0.1", default-features = false, features = ["std"] }
tracing-subscriber = "0.3"
tracing-appender = "0.2"
shell-words = "1.1"
getrandom = "0.4"
libc = "0.2"
insta = { version = "1.49", features = ["yaml"] }
tempfile = "3"
socket2 = "0.6"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
# Clippy's default groups (correctness, suspicious, style, complexity, perf) stay on;
# these add a curated set from pedantic, nursery and restriction. Thresholds and test
# allowances are in clippy.toml. `make lint` denies warnings.

# Panics and debugging left behind (tests may: clippy.toml).
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
exit = "deny"
get_unwrap = "deny"
mem_forget = "deny"

# Lint suppressions say why, and fail once they're stale (`#[expect]`, not `#[allow]`).
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
undocumented_unsafe_blocks = "deny"

# Numeric casts that can lose or flip a value.
cast_possible_truncation = "deny"
cast_possible_wrap = "deny"
cast_sign_loss = "deny"
cast_lossless = "deny"
unchecked_time_subtraction = "deny"

# Size and complexity (thresholds in clippy.toml).
too_many_lines = "deny"
cognitive_complexity = "deny"
excessive_nesting = "deny"
fn_params_excessive_bools = "deny"
struct_excessive_bools = "deny"
large_stack_arrays = "deny"
large_futures = "deny"

# API shape.
needless_pass_by_value = "deny"
trivially_copy_pass_by_ref = "deny"
unnecessary_wraps = "deny"
unused_self = "deny"
option_option = "deny"
ref_option = "deny"
rc_mutex = "deny"
clone_on_ref_ptr = "deny"

# Readable, uniform code.
manual_let_else = "deny"
items_after_statements = "deny"
semicolon_if_nothing_returned = "deny"
redundant_closure_for_method_calls = "deny"
unnested_or_patterns = "deny"
implicit_clone = "deny"
inefficient_to_string = "deny"
string_lit_as_bytes = "deny"
match_wildcard_for_single_variants = "deny"
match_wild_err_arm = "deny"
