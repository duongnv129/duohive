[package]
name = "duohive"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Run your AI coding agents as a team: a terminal app that manages standing Claude Code and OpenCode agents as an org chart"
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
duohive-core = { workspace = true }
duohive-tmux = { workspace = true }
duohive-cli = { workspace = true }
duohive-store = { workspace = true }
duohive-tui = { workspace = true }
duohive-mcp = { workspace = true }
getrandom = { workspace = true }
libc = { workspace = true }
ratatui = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["net", "io-util", "io-std", "sync", "rt", "rt-multi-thread", "macros", "time", "signal"] }
tempfile = { workspace = true }
tracing = { workspace = true }
tracing-appender = { workspace = true }
tracing-subscriber = { workspace = true }

[dev-dependencies]
rusqlite = { workspace = true }
duohive-core = { workspace = true, features = ["testkit"] }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["net", "io-util", "sync", "rt", "rt-multi-thread", "macros", "time", "test-util"] }
toml = { workspace = true }
