[package]
name = "duohive"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
duohive-core = { workspace = true }
duohive-tmux = { workspace = true }
duohive-cli = { workspace = true }
duohive-store = { workspace = true }
duohive-tui = { workspace = true }
duohive-mcp = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["net", "io-util", "sync", "rt", "macros", "time"] }
tracing = { workspace = true }

[dev-dependencies]
duohive-core = { workspace = true, features = ["testkit"] }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["net", "io-util", "sync", "rt", "rt-multi-thread", "macros", "time"] }
toml = { workspace = true }
