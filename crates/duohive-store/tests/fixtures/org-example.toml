# The PRD's example org: Payments (Backend, QA) plus a root Generalist role.
[org]
cli = "claude"

[duo]
name = "Duo"
cli = "claude"

[[team]]
name = "Payments"

[[team.role]]
name = "Backend"

[[team.role.agent]]
name = "auth-service"

[[team.role.agent]]
name = "billing-api"

[[team.role]]
name = "QA"

[[team.role.agent]]
name = "pay-qa"

[[role]]
name = "Generalist"

[[role.agent]]
name = "squad-1"

[[role.agent]]
name = "squad-2"

[[role.agent]]
name = "squad-3"
